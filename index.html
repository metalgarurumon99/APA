<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=login.html">
    <title>Sistem Automasi Pekerjaan Administrasi (APA) - BPS Kabupaten Raja Ampat</title>
    <!-- Favicon Website -->
    <link rel="icon" type="image/svg+xml" href="Assets/ART logo.svg">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #042f2e;
            color: #ffffff;
        }
        .loading-container {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00d2c4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #2dd4bf;
            text-decoration: underline;
        }
    </style>
    <script>
        window.location.replace("login.html");
    </script>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Memuat Sistem Automasi Pekerjaan Administrasi...</p>
        <p style="font-size: 0.85rem; opacity: 0.8;">Jika tidak otomatis dialihkan, <a href="login.html">klik di sini</a>.</p>
    </div>
</body>
</html>
