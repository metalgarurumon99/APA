<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raja Ampat - Animated SVG Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
        }

        /* Container Background SVG */
        .bg-raja-ampat-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-raja-ampat-container svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Dummy Konten Website */
        .hero-content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at center, rgba(3, 37, 57, 0.25) 0%, rgba(3, 37, 57, 0.6) 100%);
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            margin-bottom: 0.5rem;
        }

        .hero-content p {
            font-size: clamp(1rem, 2vw, 1.35rem);
            max-width: 650px;
            opacity: 0.95;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-explore {
            background: linear-gradient(135deg, #00d2c4, #008f86);
            color: #ffffff;
            padding: 0.85rem 2.2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 210, 196, 0.35);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-explore:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 210, 196, 0.55);
        }
    </style>
</head>

<body>

    <!-- ================= BACKGROUND SVG RAJA AMPAT ================= -->
    <div class="bg-raja-ampat-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Gradasi Langit Tropis -->
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="45%" stop-color="#7dd3fc" />
                    <stop offset="75%" stop-color="#bae6fd" />
                    <stop offset="100%" stop-color="#fef08a" />
                </linearGradient>

                <!-- Sinar Matahari Halus -->
                <radialGradient id="sunGlow" cx="20%" cy="30%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
                    <stop offset="40%" stop-color="#fef9c3" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
                </radialGradient>

                <!-- Gradasi Air Laguna Raja Ampat -->
                <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#2dd4bf" />
                    <stop offset="25%" stop-color="#14b8a6" />
                    <stop offset="60%" stop-color="#0d9488" />
                    <stop offset="100%" stop-color="#064e3b" />
                </linearGradient>

                <!-- Gradasi Bukit Karst Jauh -->
                <linearGradient id="karstFarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#5eead4" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#0f766e" stop-opacity="0.8" />
                </linearGradient>

                <!-- Gradasi Bukit Karst Tengah -->
                <linearGradient id="karstMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#059669" />
                    <stop offset="70%" stop-color="#047857" />
                    <stop offset="100%" stop-color="#134e4a" />
                </linearGradient>

                <!-- Gradasi Bukit Karst Depan -->
                <linearGradient id="karstFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#10b981" />
                    <stop offset="40%" stop-color="#047857" />
                    <stop offset="90%" stop-color="#064e3b" />
                    <stop offset="100%" stop-color="#022c22" />
                </linearGradient>

                <!-- Gradasi Cincin Karang Dangkal (Reef Lagoon) -->
                <radialGradient id="shallowLagoon" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.85" />
                    <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
                </radialGradient>
            </defs>

            <style>
                /* === KEYFRAME ANIMASI MOTION GRAPHICS === */

                /* 1. Awan Bergerak Mengalir */
                @keyframes driftCloudLeft {
                    0% {
                        transform: translateX(0);
                    }

                    100% {
                        transform: translateX(-400px);
                    }
                }

                @keyframes driftCloudRight {
                    0% {
                        transform: translateX(-200px);
                    }

                    100% {
                        transform: translateX(250px);
                    }
                }

                /* 2. Riak Ombak Halus Bertingkat */
                @keyframes waveFloatA {

                    0%,
                    100% {
                        transform: translateY(0px) scaleY(1);
                    }

                    50% {
                        transform: translateY(-7px) scaleY(1.03);
                    }
                }

                @keyframes waveFloatB {

                    0%,
                    100% {
                        transform: translateY(0px) scaleY(1);
                    }

                    50% {
                        transform: translateY(6px) scaleY(0.97);
                    }
                }

                /* 3. Manta Ray Berenang Meluncur Anggun */
                @keyframes mantaGlide {
                    0% {
                        transform: translate(-100px, 120px) rotate(-8deg) scale(0.85);
                        opacity: 0;
                    }

                    15% {
                        opacity: 0.45;
                    }

                    50% {
                        transform: translate(650px, -40px) rotate(4deg) scale(1.05);
                        opacity: 0.65;
                    }

                    85% {
                        opacity: 0.45;
                    }

                    100% {
                        transform: translate(1500px, 160px) rotate(-5deg) scale(0.9);
                        opacity: 0;
                    }
                }

                @keyframes mantaWingFlap {

                    0%,
                    100% {
                        transform: scaleY(1);
                    }

                    50% {
                        transform: scaleY(0.88);
                    }
                }

                /* 4. Burung Tropis Melintas */
                @keyframes birdFlight {
                    0% {
                        transform: translate(1480px, 40px) scale(0.65);
                        opacity: 0;
                    }

                    10% {
                        opacity: 0.75;
                    }

                    90% {
                        opacity: 0.75;
                    }

                    100% {
                        transform: translate(-100px, -20px) scale(0.65);
                        opacity: 0;
                    }
                }

                /* 5. Shimmer Kilauan Air */
                @keyframes waterShimmer {

                    0%,
                    100% {
                        opacity: 0.2;
                        transform: scaleX(1);
                    }

                    50% {
                        opacity: 0.55;
                        transform: scaleX(1.08);
                    }
                }

                /* Terapkan Class Animasi */
                .anim-cloud-1 {
                    animation: driftCloudRight 60s linear infinite alternate;
                }

                .anim-cloud-2 {
                    animation: driftCloudLeft 80s linear infinite alternate;
                }

                .anim-wave-1 {
                    animation: waveFloatA 7s ease-in-out infinite;
                }

                .anim-wave-2 {
                    animation: waveFloatB 9s ease-in-out infinite;
                }

                .anim-manta-track {
                    animation: mantaGlide 28s ease-in-out infinite;
                }

                .anim-manta-wings {
                    animation: mantaWingFlap 4s ease-in-out infinite;
                    transform-origin: center;
                }

                .anim-bird {
                    animation: birdFlight 22s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                }

                .anim-shimmer {
                    animation: waterShimmer 5s ease-in-out infinite;
                    transform-origin: center;
                }
            </style>

            <!-- 1. LANGIT & MATAHARI -->
            <rect width="1440" height="900" fill="url(#skyGrad)" />
            <circle cx="280" cy="220" r="300" fill="url(#sunGlow)" />

            <!-- 2. AWAN TROPIK MENGAMBANG -->
            <g class="anim-cloud-1" opacity="0.65">
                <path
                    d="M150,160 Q180,120 230,140 Q280,110 330,140 Q380,130 400,165 Q410,190 370,200 L170,200 Q130,195 150,160 Z"
                    fill="#ffffff" />
            </g>
            <g class="anim-cloud-2" opacity="0.5">
                <path
                    d="M850,130 Q880,95 930,115 Q980,85 1030,115 Q1080,105 1100,140 Q1110,165 1070,175 L870,175 Q830,170 850,130 Z"
                    fill="#ffffff" />
            </g>

            <!-- 3. SILUET BURUNG TROPIS -->
            <g class="anim-bird">
                <!-- Burung 1 -->
                <path d="M0,0 Q15,-14 30,0 Q45,-14 60,0 Q45,-6 30,-2 Q15,-6 0,0 Z" fill="#0f766e" />
                <!-- Burung 2 (pengiring) -->
                <path d="M-45,35 Q-33,23 -20,35 Q-7,23 5,35 Q-7,29 -20,32 Q-33,29 -45,35 Z" fill="#0f766e"
                    opacity="0.7" />
            </g>

            <!-- 4. GUGUSAN PULAU KARST JAUH (BACKGROUND DEPTH) -->
            <g fill="url(#karstFarGrad)">
                <path d="M120,530 C150,420 220,410 260,530 Z" />
                <path d="M420,540 C460,400 560,390 610,540 Z" />
                <path d="M780,535 C820,430 890,420 930,535 Z" />
                <path d="M1060,545 C1110,410 1200,400 1250,545 Z" />
            </g>

            <!-- 5. AIR LAUT DASAR (OCEAN BASE) -->
            <path d="M0,510 L1440,510 L1440,900 L0,900 Z" fill="url(#waterGrad)" />

            <!-- Efek Cincin Karang Dangkal (Lagoon Halo) Mengelilingi Pulau Karst -->
            <ellipse cx="280" cy="590" rx="190" ry="45" fill="url(#shallowLagoon)" />
            <ellipse cx="730" cy="620" rx="260" ry="55" fill="url(#shallowLagoon)" />
            <ellipse cx="1200" cy="585" rx="210" ry="45" fill="url(#shallowLagoon)" />

            <!-- 6. GUGUSAN PULAU KARST TENGAH (MIDGROUND) -->
            <g fill="url(#karstMidGrad)">
                <!-- Pulau Kiri Tengah -->
                <path d="M190,575 C210,480 250,440 280,440 C310,440 350,480 370,575 C340,580 220,580 190,575 Z" />
                <!-- Detail Tebing Terjal -->
                <path d="M260,445 C275,475 285,520 290,577 C280,577 270,576 260,575 C255,520 250,470 260,445 Z"
                    fill="#047857" opacity="0.6" />

                <!-- Pulau Kanan Tengah -->
                <path
                    d="M1100,575 C1120,460 1170,420 1210,420 C1250,420 1300,460 1320,575 C1280,580 1140,580 1100,575 Z" />
            </g>

            <!-- 7. GUGUSAN PULAU KARST DEPAN IKONIK (FOREGROUND PIANEMO/WAYAG SHAPE) -->
            <g fill="url(#karstFrontGrad)">
                <!-- Pulau Karst Raksasa Tengah (Khas Jamur/Cone Karst Raja Ampat) -->
                <path d="M600,610 C620,460 670,360 730,360 C790,360 840,460 860,610 C800,622 660,622 600,610 Z" />
                <!-- Puncak Vegetasi Lebat Tropis -->
                <circle cx="730" cy="370" r="28" fill="#34d399" opacity="0.8" />
                <circle cx="710" cy="385" r="24" fill="#10b981" />
                <circle cx="750" cy="385" r="24" fill="#059669" />

                <!-- Tekstur lekukan tebing vertikal -->
                <path d="M690,400 Q715,490 705,615 Q685,614 675,612 Q680,490 690,400 Z" fill="#022c22" opacity="0.45" />
                <path d="M755,410 Q770,500 775,617 Q755,618 745,616 Q745,500 755,410 Z" fill="#065f46" opacity="0.5" />

                <!-- Pulau Karst Kiri Depan -->
                <path d="M-20,680 C0,530 60,460 110,460 C160,460 210,530 230,680 C150,695 30,695 -20,680 Z" />
                <circle cx="110" cy="470" r="26" fill="#34d399" opacity="0.85" />

                <!-- Pulau Karst Kanan Depan -->
                <path d="M1270,700 C1290,520 1345,470 1390,470 C1430,470 1480,520 1500,700 Z" />
                <circle cx="1390" cy="480" r="25" fill="#34d399" opacity="0.85" />
            </g>

            <!-- 8. MOTION GRAPHIC: IKAN PARI MANTA RAY DI BAWAH AIR -->
            <g class="anim-manta-track">
                <g class="anim-manta-wings">
                    <!-- Siluet Badan & Sayap Manta Ray -->
                    <path d="M500,680 
                   C440,650 380,620 330,650 
                   C360,675 420,705 470,725 
                   C480,750 495,830 500,860 
                   C505,830 520,750 530,725 
                   C580,705 640,675 670,650 
                   C620,620 560,650 500,680 Z" fill="#042f2e" />
                    <!-- Ekor Cambuk Manta -->
                    <path d="M500,860 Q502,900 506,940" stroke="#042f2e" stroke-width="2.5" stroke-linecap="round"
                        fill="none" />
                    <!-- Remora / Bayangan Sirip Depan -->
                    <circle cx="485" cy="655" r="5" fill="#021d1c" />
                    <circle cx="515" cy="655" r="5" fill="#021d1c" />
                </g>
            </g>

            <!-- 9. MOTION GRAPHIC: RIAP OMBAK BERLAPIS (LAGOON WAVES) -->
            <!-- Lapisan Ombak Belakang -->
            <g class="anim-wave-1" opacity="0.45">
                <path d="M0,640 C320,620 440,660 720,635 C1000,610 1180,665 1440,635 L1440,900 L0,900 Z"
                    fill="#14b8a6" />
            </g>

            <!-- Refleksi Kilau Cahaya (Caustics Shimmer) -->
            <g class="anim-shimmer">
                <ellipse cx="680" cy="670" rx="350" ry="12" fill="#99f6e4" opacity="0.4" />
                <ellipse cx="880" cy="740" rx="420" ry="15" fill="#5eead4" opacity="0.3" />
                <ellipse cx="400" cy="790" rx="280" ry="10" fill="#99f6e4" opacity="0.25" />
            </g>

            <!-- Lapisan Ombak Depan -->
            <g class="anim-wave-2" opacity="0.55">
                <path d="M0,730 C280,755 520,705 800,735 C1080,765 1260,715 1440,740 L1440,900 L0,900 Z"
                    fill="#0f766e" />
            </g>
            <g class="anim-wave-1" opacity="0.65">
                <path d="M0,810 C360,790 600,830 960,805 C1240,780 1360,820 1440,810 L1440,900 L0,900 Z"
                    fill="#064e3b" />
            </g>
        </svg>
    </div>

    <!-- ================= KONTEN HERO WEBSITE ================= -->
    <main class="hero-content">
        <h1>PESONA RAJA AMPAT</h1>
        <p>Surga zamrud tropis di timur Indonesia. Nikmati keindahan gugusan pulau karst dan keanekaragaman bahari
            terkaya di dunia.</p>
        <a href="#jelajahi" class="btn-explore">Jelajahi Sekarang</a>
    </main>

</body>

</html>
